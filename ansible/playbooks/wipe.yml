- name: Wipe Vibro deployment from VPS
  hosts: vibro
  become: true

  tasks:
    - name: Check if project dir exists
      stat:
        path: "{{ project_dir }}"
      register: project_dir_stat

    - name: Check if docker-compose.yml exists
      stat:
        path: "{{ project_dir }}/docker-compose.yml"
      register: compose_file_stat
      when: project_dir_stat.stat.exists

    - name: Stop docker compose stack
      shell: docker compose down -v --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      when: project_dir_stat.stat.exists and compose_file_stat.stat.exists
      ignore_errors: true

    - name: Remove project directory
      file:
        path: "{{ project_dir }}"
        state: absent

    - name: Prune dangling docker images
      shell: docker image prune -f
      ignore_errors: true

    - name: Prune unused docker volumes
      shell: docker volume prune -f
      ignore_errors: true
