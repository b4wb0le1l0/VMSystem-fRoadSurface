server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Закрываем swagger и openapi
    location = /docs {
        return 403;
    }

    location = /redoc {
        return 403;
    }

    location = /openapi.json {
        return 403;
    }

    location ^~ /docs/ {
        return 403;
    }

    location ^~ /redoc/ {
        return 403;
    }

    # Разрешенные endpoint'ы
    location = /health {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params_local;
    }

    location = /legend {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params_local;
    }

    location = /ingest/windows {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params_local;
    }

    location ^~ /heatmap {
        proxy_pass http://app:8000;
        include /etc/nginx/proxy_params_local;
    }

    # Всё остальное не пускаем до backend
    location / {
        return 404;
    }
}